name: gym-dashboard-webapp

services:
  
  app:
    build:
      context: src
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      ConnectionStrings__Database: "Server=database;Port=5432;Database=gym-dashboard;User ID=postgres;Password=postgres_pwd;"
      GymClient__Username: 'marc.bacis@gmail.com'
      GymClient__Password: 'Circu94$$HutFit'
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - 8080:8080
    networks:
      - gym_dashboard_network
  
  database:
    image: postgres:18.1
    environment:
      POSTGRES_DB: gym-dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pwd
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/database:/var/opt/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d gym-dashboard" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
        - gym_dashboard_network

networks:
  gym_dashboard_network:
    name: gym_dashboard_network
